services:
  
  app1:
    build: .
    env_file:
      - .env
    environment:
      PORT: 3000
      INSTANCE_ID: server-1
    expose:
      - 3000
    healthcheck:
      test: 
        [
          "CMD", 
          "node", 
          "-e", 
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  
  app2:
    build: .
    env_file:
      - .env
    environment:
      PORT: 3000
      INSTANCE_ID: server-2
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  app3:
    build: .
    env_file:
      - .env
    environment:
      PORT: 3000
      INSTANCE_ID: server-3
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy