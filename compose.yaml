services:
  
  app1:
    build: .
    env_file:
      - .env
    environment:
      PORT: 3000
      INSTANCE_ID: server-1
    expose:
      - 3000
    healthcheck:
      test: 
        [
          "CMD", 
          "node", 
          "-e", 
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  
  app2:
    build: .
    env_file:
      - .env
    environment:
      PORT: 3000
      INSTANCE_ID: server-2
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  app3:
    build: .
    env_file:
      - .env
    environment:
      PORT: 3000
      INSTANCE_ID: server-3
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  order-worker:
    build: .
    container_name: mq-lb-rprl-order-worker
    command: ["node", "workers/orderWorker.js"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: ${MONGO_URI}
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data: