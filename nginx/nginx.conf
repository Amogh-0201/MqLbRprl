worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    # ---------------------------------
    # RATE LIMITING
    # ---------------------------------

    # Normal API traffic
    limit_req_zone $binary_remote_addr
        zone=api_limit:10m
        rate=20r/s;

    # Authentication
    limit_req_zone $binary_remote_addr
        zone=auth_limit:10m
        rate=2r/s;

    # Flash-sale admission
    limit_req_zone $binary_remote_addr
        zone=flash_sale_limit:10m
        rate=1000r/s;

    # Job-status polling
    limit_req_zone $binary_remote_addr
        zone=job_status_limit:10m
        rate=100r/s;

    limit_req_status 429;
    limit_req_log_level warn;

    # ---------------------------------
    # LOAD BALANCING
    # ---------------------------------

    upstream backend {
        zone backend 64k;

        server app1:3000
            resolve
            max_fails=3
            fail_timeout=10s;

        server app2:3000
            resolve
            max_fails=3
            fail_timeout=10s;

        server app3:3000
            resolve
            max_fails=3
            fail_timeout=10s;
    }

    log_format load_balancer
        '$remote_addr - $request '
        'status=$status '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status';

    access_log /var/log/nginx/access.log load_balancer;

    server {

        listen 80;

        # ---------------------------------
        # HEALTH
        # ---------------------------------

        location = /health {

            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";
        }

        # ---------------------------------
        # AUTH
        # ---------------------------------

        location ^~ /api/v1/auth {

            limit_req
                zone=auth_limit
                burst=5
                nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";
        }

        # ---------------------------------
        # FLASH-SALE ORDER ADMISSION
        # ---------------------------------

        location = /api/v1/orders {

            limit_req
                zone=flash_sale_limit
                burst=1000
                nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";
        }

        # ---------------------------------
        # JOB STATUS
        # ---------------------------------

        location ^~ /api/v1/orders/jobs/ {

            limit_req
                zone=job_status_limit
                burst=200
                nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";
        }

        # ---------------------------------
        # GENERAL API
        # ---------------------------------

        location ^~ /api/ {

            limit_req
                zone=api_limit
                burst=50
                nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";
        }

        # ---------------------------------
        # FALLBACK
        # ---------------------------------

        location / {

            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";
        }
    }
}