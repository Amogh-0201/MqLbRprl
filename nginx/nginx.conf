events {
}

http {

    # Docker's internal DNS resolver.
    # This allows Nginx to re-resolve container names.
    resolver 127.0.0.11 valid=5s ipv6=off;

    resolver_timeout 5s;

    #---------------------------------
    # Rate Limiting
    #---------------------------------

    # for general apis
    limit_req_zone $binary_remote_addr
        zone=api_limit:10m
        rate=10r/s;
    
    # for authentication endpoints
    limit_req_zone $binary_remote_addr
        zone=auth_limit:10m
        rate=2r/s;

    # status for limit request
    limit_req_status 429;

    # log rate limit events at warning level
    limit_req_log_level warn;

    #---------------------------------
    # Backend Servers/Load Balancing
    #---------------------------------

    upstream backend {

        # Shared memory zone allows runtime DNS re-resolution.
        zone backend 64k;

        server app1:3000
            resolve
            max_fails=3
            fail_timeout=10s;
        # these two max fails and timeout is like automatic circuit breaker to route traffic away from the failing containers

        server app2:3000
            resolve
            max_fails=3
            fail_timeout=10s;

        server app3:3000
            resolve
            max_fails=3
            fail_timeout=10s;
    }

    #---------------------------------
    # Logging
    #---------------------------------

    log_format load_balancer
        '$remote_addr - $request '
        'status=$status '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status';
    
    access_log /var/log/nginx/access.log load_balancer;

    #---------------------------------
    # Nginx server
    #---------------------------------

    server {

        listen 80;

        # Health endpoint
        location = /health {

            proxy_pass http://backend;

            proxy_http_version 1.1;

            # Preserve useful client/request information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Avoid keeping stale upstream connections around
            proxy_set_header Connection "";
        }

        # Auth endpoint
        location ^~ /api/v1/auth {

            limit_req
                zone=auth_limit
                burst=5
                nodelay;
            
            proxy_pass http://backend;

            proxy_http_version 1.1;

            # Preserve useful client/request information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Avoid keeping stale upstream connections around
            proxy_set_header Connection "";
        }

        # General API endpoint
        location ^~ /api/ {
            
            limit_req
                zone=api_limit
                burst=20
                nodelay;
            
            proxy_pass http://backend;

            proxy_http_version 1.1;

            # Preserve useful client/request information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Avoid keeping stale upstream connections around
            proxy_set_header Connection "";
        }

        # everything else
        location / {

            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";
        }
    }
}