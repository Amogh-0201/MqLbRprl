events {
}

http {

    # Docker's internal DNS resolver.
    # This allows Nginx to re-resolve container names.
    resolver 127.0.0.11 valid=5s ipv6=off;

    resolver_timeout 5s;

    #---------------------------------
    # Backend Servers
    #---------------------------------

    upstream backend {

        # Shared memory zone allows runtime DNS re-resolution.
        zone backend 64k;

        server app1:3000
            resolve
            max_fails=3
            fail_timeout=10s;
        # these two max fails and timeout is like automatic circuit breaker to route traffic away from the failing containers

        server app2:3000
            resolve
            max_fails=3
            fail_timeout=10s;

        server app3:3000
            resolve
            max_fails=3
            fail_timeout=10s;
    }

    #---------------------------------
    # Logging
    #---------------------------------

    log_format load_balancer
        '$remote_addr - $request '
        'status=$status '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status';
    
    access_log /var/log/nginx/access.log load_balancer;

    #---------------------------------
    # Nginx server
    #---------------------------------

    server {

        listen 80;

        location / {

            proxy_pass http://backend;

            proxy_http_version 1.1;

            # Preserve useful client/request information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Avoid keeping stale upstream connections around
            proxy_set_header Connection "";
        }
    }
}